<article class="post-card"{% if include.searchable %} data-post data-search="{{ include.post.title | append: ' ' | append: include.post.description | append: ' ' | append: include.post.content | strip_html | normalize_whitespace | downcase | escape }}" data-tags="{{ include.post.tags | jsonify | escape }}"{% endif %}>
  {% include post-meta.html post=include.post %}
  <div class="post-card-main">
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }} <span class="post-arrow" aria-hidden="true">&#8599;</span></a></h3>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncatewords: 35 | escape }}</p>
    {% include tags.html tags=include.post.tags %}
  </div>
</article>
